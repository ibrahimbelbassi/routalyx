spring.application.name=Routalyx

# PostgreSQL connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/routalyx}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:routalyx}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}

# Database migrations
spring.flyway.enabled=true