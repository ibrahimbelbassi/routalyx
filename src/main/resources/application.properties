spring.application.name=Routalyx

# PostgreSQL connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/routalyx}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:routalyx}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}

# Database migrations
spring.flyway.enabled=true

# Actuator: Health checks for Kubernetes
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Keep liveness independent from external dependencies
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db