services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: routalyx
      POSTGRES_USER: routalyx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - routalyx-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routalyx -d routalyx"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  routalyx-postgres-data:
