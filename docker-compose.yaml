services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: routalyx
      POSTGRES_USER: routalyx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - routalyx-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routalyx -d routalyx"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: routalyx_test
      POSTGRES_USER: routalyx_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Set TEST_POSTGRES_PASSWORD in .env}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U routalyx_test -d routalyx_test" ]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/routalyx
      SPRING_DATASOURCE_USERNAME: routalyx
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  test:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace
    volumes:
      - .:/workspace
      - routalyx-maven-cache:/root/.m2
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/routalyx_test
      SPRING_DATASOURCE_USERNAME: routalyx_test
      SPRING_DATASOURCE_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Set TEST_POSTGRES_PASSWORD in .env}
    command: ["./mvnw", "test"]
    depends_on:
      postgres-test:
        condition: service_healthy

volumes:
  routalyx-postgres-data:
  routalyx-maven-cache:
