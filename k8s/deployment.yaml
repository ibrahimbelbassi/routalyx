apiVersion: apps/v1
kind: Deployment
metadata:
  name: routalyx
  namespace: routalyx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: routalyx
  template:
    metadata:
      labels:
        app: routalyx
    spec:
      containers:
        - name: routalyx
          image: ghcr.io/ibrahimbelbassi/routalyx:sha-8cc5b17
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          envFrom:
            - configMapRef:
                name: routalyx-config
            - secretRef:
                name: routalyx-db

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
